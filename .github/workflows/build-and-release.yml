name: Build and Release Android APK

# NOTE: Automatic triggers disabled to prevent consuming GitHub Actions quota.
# Trigger manually from GitHub UI or via: gh workflow run build-and-release.yml
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🛠️ Generate Android native project (Expo Prebuild)
        run: bunx expo prebuild --platform android --clean

      - name: 🔑 Configure Release Keystore
        run: |
          cd android/app
          # Create self-signed keystore if not provided via secrets
          keytool -genkeypair -v -storetype PKCS12 -keystore release.keystore \
            -alias nfctooling -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=NFCTooling, OU=Mobile, O=NFCTooling, L=Jakarta, C=ID"

      - name: ⚙️ Configure Gradle signing
        run: |
          cat << 'EOF' >> android/app/build.gradle
          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'android'
                      keyAlias 'nfctooling'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: 🏗️ Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 🏷️ Determine Version Tag
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "TAG_NAME=${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            PACKAGE_VERSION=$(node -p "require('./package.json').version")
            echo "TAG_NAME=v${PACKAGE_VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: 📂 Rename APK for release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ./nfc-tooling.apk

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          name: "Release ${{ steps.version.outputs.TAG_NAME }}"
          files: ./nfc-tooling.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
